name: CI

concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number || github.sha}}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "renovate/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 6'

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_XMLDOC_MODE: "skip"

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
    - run: git config --global core.autocrlf true
    - uses: actions/checkout@v4

    - run: curl -L https://github.com/editorconfig-checker/editorconfig-checker/releases/download/2.3.5/ec-linux-amd64.tar.gz  | tar xzf - -C /opt
    - run: /opt/bin/ec-linux-amd64 -v

    - name: Install deps
      run: npm ci

    - name: Lint
      run: npm run eslint

  test-js:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - '18.1'
          - '22.2'
          - 'latest'

    steps:

    - name: Checkout sources
      uses: actions/checkout@v4

    - name: Build no-jquery package
      run: node build/make-nojquery

    - name: Move lockfile
      if: ${{ matrix.version != 'latest' }}
      shell: bash
      run: cp -f js-test/${{ matrix.version }}/package-lock.json package-lock.json

    - run: npm ci

    - run: npm run dts
    - run: npm run karma
    - run: npm run karma-bundled
    - run: npm run karma-bundled-nojquery
    - run: npm run karma-bundled-nojquery-cjs

    - uses: codecov/codecov-action@v3
      with:
        files: js-test/coverage/lcov.info

  test-dotnet:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - run: nuget install -Verbosity quiet -ExcludeVersion -OutputDirectory . -Version 2022.2.3 JetBrains.dotCover.CommandLineTools

    - uses: ./.github/actions/dotnet-test-build

    - run: JetBrains.dotCover.CommandLineTools\tools\dotCover cover --ReturnTargetExitCode --ReportType=DetailedXML --Filters="+:module=DevExtreme.AspNet.Data" --Output=coverage_dotnet.xml --TargetExecutable=net\dotnet-test-all.cmd

    - uses: codecov/codecov-action@v4
      with:
        files: coverage_dotnet.xml

  release-packages:
    runs-on: ubuntu-latest

    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
      BUILD_CONFIGURATION: ${{ (github.repository == 'DevExpress/DevExtreme.AspNet.Data' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && 'Release' || 'Debug' }}

    steps:
    - uses: actions/checkout@v4

    - run: node build/make-nojquery
    - run: node build/replace-meta "${{ github.run_number }}" "${{ github.ref }}" "${{ github.repository }}"

    - run: npm pack
    - run: npm pack ./js-nojquery

    - name: Prepare NuGet deps
      if: env.BUILD_CONFIGURATION == 'Release'
      uses: ./.github/actions/prepare-nuget-deps
      with:
        encrypted-key-path: net/DevExtreme.AspNet.Data/release.snk.enc
        release-key-secret: ${{ secrets.RELEASE_KEY_SECRET }}

    - name: Pack NuGet package
      run: dotnet pack net/DevExtreme.AspNet.Data -c "$BUILD_CONFIGURATION" --include-symbols

    - name: Remove signing key
      if: always()
      run: rm -f net/DevExtreme.AspNet.Data/release.snk

    - uses: actions/upload-artifact@v4
      with:
        name: release-packages
        path: |
          net/DevExtreme.AspNet.Data/bin/${{ env.BUILD_CONFIGURATION }}/*.nupkg
          devextreme-aspnet-data-*.tgz
        retention-days: 14
        if-no-files-found: error

  docfx:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - run: dotnet build net/DevExtreme.AspNet.Data
    - run: net\docfx\build.cmd

    - uses: actions/upload-artifact@v4
      with:
        name: docfx-site
        path: net/docfx/build/site
